# تشغيلة أولى فقط (قبل الحصول على شهادة SSL) - HTTP فقط، تكفي لتمرير تحدي certbot.
# بعد نجاح "docker compose run --rm certbot ..." استبدل محتوى nginx/nginx.conf
# بمحتوى nginx.ssl.conf.example (عدّل الدومين فيه) ثم أعد تشغيل: docker compose restart nginx

server {
    listen 80;
    server_name _;

    client_max_body_size 25M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /app/staticfiles/;
    }
    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
